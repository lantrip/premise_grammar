[package]
name = "premise-spellcheck"
version = "0.1.0"
edition = "2021"
description = "WASM spellcheck engine with SymSpell, custom dictionary, and fuzzy completion"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = { version = "0.6", optional = true }
postcard = { version = "1.0", features = ["alloc"], optional = true }
quick-xml = { version = "0.37", optional = true }

[features]
default = ["wasm", "thesaurus", "definitions"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
thesaurus = []
definitions = ["dep:postcard", "dep:quick-xml"]

[[bin]]
name = "process-dictionary"
path = "tools/process_dictionary.rs"
required-features = ["definitions"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
