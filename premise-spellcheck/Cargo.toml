[package]
name = "premise-spellcheck"
version = "0.1.0"
edition = "2021"
description = "WASM spellcheck engine with SymSpell, custom dictionary, and fuzzy completion"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
