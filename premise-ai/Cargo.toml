[package]
name = "premise-ai"
version = "0.1.0"
edition = "2021"
description = "Shared AI provider interfaces and configuration for Premise tools"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
dirs = "5.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"


