name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Supply-chain gate: advisories, version bans, source allowlist (deny.toml).
  # Its own job because it reads Cargo.lock and needs no toolchain or cache, so
  # it reports in seconds regardless of what the build job is doing.
  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests (core and notes)
        run: cargo test -p premise-core -p premise-notes -- --nocapture

      - name: Build CLI
        run: cargo build -p premise --locked
