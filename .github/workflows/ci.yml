name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests (core and notes)
        run: cargo test -p premise-core -p premise-notes -- --nocapture

      - name: Build CLI
        run: cargo build -p premise --locked
