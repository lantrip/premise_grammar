[package]
name = "premise-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Premise language parsing and hydration"
license = "MIT OR Apache-2.0"

[lib]
name = "premise_core"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
glob = "0.3"
insta = { version = "1.39", features = ["json"] }
schemars = { version = "0.8", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
rand = "0.8"
dirs = "5.0"
premise-notes = { path = "../premise-notes" }

[build-dependencies]
cc = "1.0"


